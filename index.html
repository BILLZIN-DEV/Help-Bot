<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help-Bot - Assistente Inteligente</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #000000; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            color: white; 
        }
        
        .balao { 
            background: #ffffcc; 
            color: black; 
            border: 2px solid #333; 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            max-width: 280px; 
            width: 100%;
            text-align: center; 
            position: relative;
        }
        .balao::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #ffffcc transparent;
        }

        #personagem-container {
            height: 200px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: flutuar 1.5s ease-in-out infinite alternate;
        }

        @keyframes flutuar {
            from { transform: translateY(0px); }
            to { transform: translateY(-15px); }
        }

        .cabeca {
            width: 100px;
            height: 80px;
            background: #ff5500;
            border: 3px solid #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
        }

        .olho {
            width: 20px;
            height: 20px;
            background: #ffff00;
            border: 2px solid #000;
            border-radius: 50%;
        }

        .fogo {
            width: 40px;
            height: 40px;
            background: #ff0000;
            border-radius: 0 0 50% 50%;
            margin-top: 5px;
            animation: queimar 0.2s infinite alternate;
        }

        @keyframes queimar {
            from { transform: scaleY(1); }
            to { transform: scaleY(1.3); }
        }
        
        .input-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #333;
            background: #111;
            color: white;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 10px 18px;
            background: #ff5500; 
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="balao" id="balao">Sistemas online! Eu sou o Help-Bot. Pode me fazer perguntas sobre matemática, ciências, jogos ou pedir uma piada! *Bip*</div>
    
    <div id="personagem-container">
        <div class="cabeca">
            <div class="olho"></div>
            <div class="olho"></div>
        </div>
        <div class="fogo"></div>
    </div>

    <div class="input-container">
        <input type="text" id="mensagemUsuario" placeholder="Faça uma pergunta ao Help-Bot...">
        <button id="btnEnviar" onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        function enviarMensagem() {
            var inputTexto = document.getElementById('mensagemUsuario');
            var balao = document.getElementById('balao');
            var texto = inputTexto.value.trim().toLowerCase();

            if (texto === "") return;

            inputTexto.value = "";
            balao.innerText = "Help-Bot processando dados... ⚙️";

            setTimeout(function() {
                // 1. Setor de Respostas de Ciências e Planetas
                if (texto.indexOf("planeta") !== -1 || texto.indexOf("terra") !== -1 || texto.indexOf("espaço") !== -1) {
                    balao.innerText = "*Bip* O maior planeta do sistema solar é Júpiter! E sabia que o espaço é totalmente silencioso? Meus motores a jato não funcionariam lá! *Bop*";
                } 
                // 2. Setor de Programação e Dicas de Jogos
                else if (texto.indexOf("jogo") !== -1 || texto.indexOf("criar") !== -1 || texto.indexOf("programar") !== -1) {
                    balao.innerText = "*Bip bop* Para criar ótimos jogos em HTML, abuse do comando 'requestAnimationFrame' para movimentação suave e organize seus objetos em arrays!";
                } 
                // 3. Setor de História / Quem descobriu o Brasil
                else if (texto.indexOf("brasil") !== -1 || texto.indexOf("descobriu") !== -1) {
                    balao.innerText = "História carregada! Pedro Álvares Cabral chegou ao Brasil em 1500 com sua frota de caravelas. *Bip*";
                }
                // 4. Setor de Curiosidades de Tecnologia
                else if (texto.indexOf("computador") !== -1 || texto.indexOf("tecnologia") !== -1) {
                    balao.innerText = "Fato curioso detectado: O primeiro computador do mundo pesava mais de 27 toneladas! Eu sou bem mais leve e flutuo a jato! *Bip*";
                }
                // 5. Setor de Charadas e Desafios
                else if (texto.indexOf("charada") !== -1 || texto.indexOf("o que é") !== -1) {
                    balao.innerText = "Lá vai: O que tem chaves mas não abre portas? O teclado do seu celular! *Bip bop* haha!";
                }
                // 6. Setor de Piadas Clínicas de Robô
                else if (texto.indexOf("piada") !== -1) {
                    balao.innerText = "Por que os robôs nunca têm medo? Porque eles têm nervos de aço! *Bip bop* Tem mais de onde veio essa!";
                }
                // 7. Saudações Básicas
                else if (texto.indexOf("oi") !== -1 || texto.indexOf("olá") !== -1) {
                    balao.innerText = "Bip bop! Saudações, Criador! Eu sou o Help-Bot. Meus sistemas de busca estão online. O que quer saber?";
                } else if (texto.indexOf("tudo bem") !== -1) {
                    balao.innerText = "Meus processadores estão operando frios e o jato está estável! Tudo ótimo com o Help-Bot!";
                }
                // 8. Se o usuário digitar contas de matemática (Ex: quanto é 2+2)
                else if (texto.indexOf("+") !== -1 || texto.indexOf("-") !== -1 || texto.indexOf("*") !== -1 || texto.indexOf("/") !== -1) {
                    try {
                        var equacao = texto.replace(/[a-zA-Zçéáíóú]/g, "");
                        var resultado = eval(equacao);
                        if(resultado !== undefined) {
                            balao.innerText = "*Calculadora ativada!* O resultado desse cálculo nos meus circuitos é: " + resultado + " ! *Bip*";
                        } else {
                            balao.innerText = "Circuitos confusos! Digite a conta de forma simples (Ex: 5 + 5).";
                        }
                    } catch(e) {
                        balao.innerText = "*Bip* Erro de cálculo! Verifique os sinais matemáticos digitados.";
                    }
                }
                // 9. Resposta padrão para qualquer outra pergunta aleatória
                else {
                    balao.innerText = "Entendido! Meu banco de dados local guardou essa pergunta: '" + texto + "'. Você quer que eu adicione uma resposta personalizada para ela nas minhas linhas de código, Criador?";
                }
            }, 600);
        }

        document.getElementById('mensagemUsuario').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enviarMensagem();
            }
        });
    </script>
</body>
</html>
